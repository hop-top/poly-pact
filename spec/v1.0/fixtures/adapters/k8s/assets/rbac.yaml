apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployment-observer
  namespace: operations
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: release-observer-binding
  namespace: operations
subjects:
  - kind: ServiceAccount
    name: release-observer
    namespace: operations
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployment-observer
