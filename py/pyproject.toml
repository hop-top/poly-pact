# Python SDK of the PACT protocol. Versions are vetted in docs/sdk/deps-py.md
# of the source repository: ranges here, exact pins in constraints.txt
# (install with `pip install -c constraints.txt -e ".[dev]"`). Every range is
# written `name>=X,<Y`, and tests/test_constraints.py checks each pin against
# it; tests/test_depcheck.py checks the sets.

[build-system]
requires = ["flit_core==4.1.0"]
build-backend = "flit_core.buildapi"

[project]
name = "hop-top-pact"
# PEP 440 form of the release seed 1.0.0-alpha.0 (release-please manifest).
# release-please rewrites this line on every release in its SemVer spelling
# (1.0.0-alpha.1), which PEP 440 accepts and normalizes (1.0.0a1).
version = "1.0.0a0"
description = "Python SDK of the PACT protocol: wire types, strict JSON, JCS, digests, ES256 JWS and the native adapter contract"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Idea Crafters LLC", email = "open@ideacrafters.com" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=50.0.2,<51",
    "jsonschema>=4.26.0,<5",
    "referencing>=0.37.0,<0.38",
]

[project.optional-dependencies]
dev = [
    "build>=1.6.1,<2",
    "mypy>=2.4.0,<3",
    "pytest>=9.1.1,<10",
    "rfc8785>=0.1.4,<0.2",
    "ruff>=0.17.1,<0.18",
]

[project.urls]
Homepage = "https://github.com/hop-top/poly-pact"
Source = "https://github.com/hop-top/pact-py"

[tool.flit.module]
name = "hop_top_pact"

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
# tests/ holds the broken-adapter package, imported by the tests as broken.
pythonpath = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", "tests", "scripts", "examples"]
