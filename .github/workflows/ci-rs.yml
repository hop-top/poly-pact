name: ci-rs

on:
  push:
    branches: [main, next, 'release/*']
    paths:
      - "rs/**"
      - "spec/v1.0/fixtures/**"
      - "spec/v1.0/schemas/**"
      - "tools/parity/gates.json"
      - "tools/mutants.py"
      - "mise.toml"
      - "Makefile"
      - ".github/workflows/ci-rs.yml"
  pull_request:
    paths:
      - "rs/**"
      - "spec/v1.0/fixtures/**"
      - "spec/v1.0/schemas/**"
      - "tools/parity/gates.json"
      - "tools/mutants.py"
      - "mise.toml"
      - "Makefile"
      - ".github/workflows/ci-rs.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Rust / Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Rust from rs/mise.toml (with rustfmt and clippy) and Python, from the
      # root mise.toml, for the mutation runner; nothing else is installed.
      - uses: jdx/mise-action@v5.1.2
        with:
          working_directory: rs
          install: true
          install_args: rust python
          cache: true

      - name: Fetch dependencies
        run: cd rs && mise exec -- cargo fetch --locked

      - name: Lint
        run: make rs-lint

      - name: Test
        run: make rs-test

      - name: Vectors
        run: make rs-vectors > /dev/null

      - name: Schema copy
        run: make rs-check-schema

      - name: Build and package
        run: make rs-build

      - name: Packaged tests
        # The published crate must build and test from its own files: the
        # tests that read the shared fixtures skip outside the repository.
        run: |
          dir="$(mktemp -d)"
          tar -xzf rs/target/package/hop-top-pact-*.crate -C "$dir"
          cd rs && mise exec -- cargo test --locked --manifest-path "$(echo "$dir"/hop-top-pact-*/Cargo.toml)"

      - name: Mutants
        run: make rs-mutants

  msrv:
    # The rust-version floor of rs/Cargo.toml. mise reads MISE_RUST_VERSION
    # in place of the mise.toml pin.
    name: Rust / MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MISE_RUST_VERSION: "1.88"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v5.1.2
        with:
          working_directory: rs
          install: true
          install_args: rust
          cache: true

      - name: Test
        working-directory: rs
        run: PACT_REQUIRE_VECTORS=1 mise exec -- cargo test --locked --all-targets

  test-windows:
    name: Rust / Test (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify spec bytes
        # Fixture bytes are exact inputs to the digest and signature tests; a
        # line-ending conversion at checkout rewrites them.
        run: |
          converted=$(git ls-files --eol -- spec | awk '{ if (substr($1, 3) != substr($2, 3)) print }')
          if [ -n "$converted" ]; then
            echo "::error::checkout converted line endings under spec/"
            printf '%s\n' "$converted"
            exit 1
          fi

      - uses: jdx/mise-action@v5.1.2
        with:
          working_directory: rs
          install: true
          install_args: rust
          cache: true

      - name: Test
        run: make rs-test
