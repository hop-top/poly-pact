name: publish

# Routes a <component>/v<version> tag, pushed by release-please, to the
# hop-top/.github publish-on-tag reusable workflow: registry publish for the
# component's ecosystem, then the read-only mirror push. The ecosystems map
# below must agree with .github/release-please-config.json:
# tools/release/check-publish-map.py (make release-check, ci-release) checks
# it.

on:
  push:
    # Every component has an ecosystems entry below; there is no root
    # umbrella package to exclude.
    tags: ['*/v*']

permissions:
  contents: read

jobs:
  package:
    # A component whose package has not landed yet (no ts/, py/, rs/ or php/
    # manifest in the tagged tree) is skipped with a notice instead of
    # failing in the registry job. Its directory and release type come from
    # .github/release-please-config.json; the manifest file per release
    # type is go.mod for Go and, for ts, py, rs and php, the file the
    # Makefile language guards test.
    name: Publish / Package present
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          component="${TAG%%/v*}"
          config=.github/release-please-config.json
          # A jq program: $c is a jq variable, not a shell one.
          # shellcheck disable=SC2016
          query='.packages | to_entries[] | select(.value.component == $c) | "\(.key)\t\(.value["release-type"])"'
          row="$(jq -r --arg c "$component" "$query" "$config")"
          if [ -z "$row" ]; then
            echo "::notice::component $component is not in $config; skipping publish"
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(printf '%s\n' "$row" | wc -l)" -ne 1 ]; then
            echo "::error::component $component names more than one package in $config"
            exit 1
          fi
          dir="${row%%$'\t'*}"
          type="${row#*$'\t'}"
          case "$type" in
            go) manifest=go.mod ;;
            node) manifest=package.json ;;
            python) manifest=pyproject.toml ;;
            rust) manifest=Cargo.toml ;;
            php) manifest=composer.json ;;
            simple) manifest= ;;
            *)
              echo "::error::release type $type of $dir has no package manifest rule here"
              exit 1
              ;;
          esac
          if [ -n "$manifest" ] && [ -f "$dir/$manifest" ]; then
            present=true
          elif [ -z "$manifest" ] && [ -d "$dir" ]; then
            present=true
          else
            present=false
            echo "::notice::package $dir (${manifest:-directory}) is absent at $TAG; skipping publish"
          fi
          echo "present=$present" >> "$GITHUB_OUTPUT"

  publish:
    needs: package
    if: needs.package.outputs.present == 'true'
    permissions:
      contents: read
      # publish-ts and publish-py (OIDC mode) declare id-token: write; a
      # called workflow cannot hold more than its caller grants.
      id-token: write
    uses: hop-top/.github/.github/workflows/publish-on-tag.yml@v0
    # Only the secrets publish-on-tag.yml@v0 declares. The release-bot App
    # secrets serve release-please.yml and spec-status-line.yml, not this file.
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      NPM_REGISTRY_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN }}
      PYPI_REGISTRY_TOKEN: ${{ secrets.PYPI_REGISTRY_TOKEN }}
      PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
      PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
      GH_MIRROR_PAT: ${{ secrets.GH_MIRROR_PAT }}
    with:
      homepage: https://github.com/hop-top/poly-pact
      description-prefix: "READ-ONLY MIRROR"
      ecosystems: |
        pact-go:
          # The library module hop.top/pact-go.
          dir: go
          ecosystem: go
          mirror: hop-top/pact-go
        pact:
          # The command module hop.top/pact (pactc, pactconf, pactfix,
          # pactvalidate). Its own mirror: the mirror push replaces a
          # mirror's main with one directory, so cli/ cannot share
          # hop-top/pact-go with go/. Release binaries come later, from the
          # shared goreleaser-on-tag workflow.
          dir: cli
          ecosystem: go
          mirror: hop-top/pact
        pact-ts:
          dir: ts
          ecosystem: ts
          package: "@hop-top/pact"
          mirror: hop-top/pact-ts
        pact-py:
          dir: py
          ecosystem: py
          package: hop-top-pact
          mirror: hop-top/pact-py
          # Token, not the OIDC default: OIDC trusted publishing returned
          # invalid-publisher in sibling polyglot repos, which fell back to
          # a token. Revisit after the first release.
          pypi-auth: token
          # publish-py installs only pip, pytest and build, so the package
          # and its pinned development set are installed first.
          test-command: 'python -m pip install -c constraints.txt -e ".[dev]" && python -m pytest -q'
        pact-rs:
          dir: rs
          ecosystem: rs
          package: hop-top-pact
          mirror: hop-top/pact-rs
        pact-php:
          # Packagist reads the mirror: publish-on-tag pushes the mirror
          # first, then asks Packagist to re-index hop-top/pact-php, whose
          # composer.json names the package hop-top/pact. No version field in
          # composer.json: Packagist takes the version from the mirror tag.
          dir: php
          ecosystem: php
          package: hop-top/pact
          mirror: hop-top/pact-php
        pact-spec:
          # The spec tree publishes to its own read-only mirror. The
          # component is release-please's for package `spec/v1.0`
          # (.github/release-please-config.json), so tags are
          # `pact-spec/v*`. `dir` is `spec`, not `spec/v1.0`: the mirror
          # ships the whole spec tree, README and LICENSE included, with
          # spec/ promoted to the mirror root, so hop-top/spec-pact shows
          # v1.0/ at its root. No target-prefix: a later contract line is a
          # sibling spec/vX.Y/ directory here and on the mirror.
          #
          # `none` = a payload with no registry: every publish-* job in
          # publish-on-tag.yml@v0 gates on an exact `== '<eco>'` match
          # (ts/py/rs/php), so `none` matches none of them and all of them
          # skip; the mirror job's guard is `ecosystem != ''`, which `none`
          # satisfies, so the mirror still runs. Do NOT "simplify" this by
          # omitting `ecosystem`: an absent field makes the parse step emit
          # an EMPTY ecosystem output, which the mirror job reads as an
          # umbrella/meta tag and green-skips -- the mirror would publish
          # nothing, silently.
          ecosystem: none
          dir: spec
          mirror: hop-top/spec-pact
