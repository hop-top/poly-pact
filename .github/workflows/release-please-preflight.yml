name: release-please-preflight

# Catches release config drift at PR time instead of tag-push time:
# config, manifest, publish map and caller shape, including the
# target-versioning records. Delegates to the shared hop-top/.github
# workflow. Runs on every PR (no `paths:` filter) so it can be a required
# check: a required check whose workflow is filtered out never reports and
# leaves the PR pending.
#
# Pinned with release-please.yml to the same hop-top/.github commit, so
# the preflight checks the config with the code the release run uses
# (`versioning: "target"` needs v0.15.0 or later). Move the pin together
# with release-please.yml's.

on:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  preflight:
    permissions:
      contents: read
    uses: hop-top/.github/.github/workflows/release-please-preflight.yml@4200be92484ff51e32add852f2261336f04cfb14
