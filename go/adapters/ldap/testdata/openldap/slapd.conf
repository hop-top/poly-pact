# slapd.conf(5) of the integration tier. The root DN loads the seed with the
# Relax Rules control; the lookup accounts of the seed read the suffix except
# userPassword; a simple bind needs TLS.
include /etc/openldap/schema/core.schema
include /etc/openldap/schema/cosine.schema
include /etc/openldap/schema/inetorgperson.schema
include /etc/openldap/schema/nis.schema
modulepath /usr/lib/openldap
moduleload back_mdb.so
moduleload memberof.so
moduleload ppolicy.so
pidfile /run/openldap/slapd.pid
TLSCertificateFile /etc/openldap/tls/server.crt
TLSCertificateKeyFile /etc/openldap/tls/server.key
security simple_bind=128

database mdb
suffix "dc=northstar,dc=example"
rootdn "cn=admin,dc=northstar,dc=example"
rootpw integration-admin-secret
directory /var/lib/openldap/data
overlay memberof
overlay ppolicy

access to attrs=userPassword
  by anonymous auth
  by * none
access to dn.subtree="dc=northstar,dc=example"
  by dn.exact="uid=pact-lookup,ou=service,ou=people,ou=hq,dc=northstar,dc=example" read
  by dn.exact="uid=pact-lookup,ou=people,ou=branch,dc=northstar,dc=example" read
  by * none
